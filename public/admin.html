<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin | Dey Auto Parts</title><link rel="stylesheet" href="admin.css">
</head>
<body>
  <main id="login-view" class="login-shell"><form id="login-form" class="login-card"><div class="logo">D</div><p class="eyebrow">DEY AUTO PARTS</p><h1>Admin sign in</h1><p class="muted">Manage your catalogue and orders securely.</p><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="login-message" class="message" role="alert"></p></form></main>
  <div id="app-view" class="app" hidden>
    <aside><a class="brand"><b>D</b><span>DEY AUTO PARTS<small>ADMIN CONSOLE</small></span></a><nav><button class="nav active" data-view="products">▦ <span>Products</span></button><button class="nav" data-view="models">⌁ <span>Bike models</span></button><button class="nav" data-view="orders">□ <span>Orders</span></button></nav><button id="logout" class="logout">↪ Sign out</button></aside>
    <section class="content"><header><div><p class="eyebrow" id="section-kicker">CATALOGUE</p><h1 id="page-title">Products</h1></div><button id="add-button">+ Add product</button></header><p id="app-message" class="message" role="alert"></p><div class="table-card"><div class="table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div></div></section>
  </div>
  <dialog id="editor"><form id="editor-form" method="dialog"><div class="dialog-head"><h2 id="dialog-title">Add product</h2><button type="button" class="icon-button" id="close-dialog">×</button></div><div id="form-fields" class="form-grid"></div><div class="dialog-actions"><button type="button" class="secondary" id="cancel-dialog">Cancel</button><button id="save-button" value="default">Save changes</button></div></form></dialog>
  <script src="admin.js"></script>
</body></html>
